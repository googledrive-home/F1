name: Deploy F1 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f1-pages-release
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser module syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text()
          modules = re.findall(r'<script type="module">\s*(.*?)</script>', html, re.S)
          if len(modules) != 1:
              raise SystemExit(f"Expected one inline application module, found {len(modules)}")
          Path("/tmp/f1-app.mjs").write_text(modules[0])
          PY
          node --check /tmp/f1-app.mjs
          node --check src/world3d.mjs
          node --check src/mirror3d.mjs
          node --check src/race.mjs

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: node --test test/*.test.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
